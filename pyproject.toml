[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gclab"
version = "1.0.0"
description = "Six memory managers over one simulated heap, verified against a reference model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
gclab = "gclab.__main__:main"

[tool.setuptools]
packages = ["gclab"]
